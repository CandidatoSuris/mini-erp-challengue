services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src/MiniErp.Api
    volumes:
      - ./backend:/src
    command: dotnet run --urls http://0.0.0.0:5080
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
